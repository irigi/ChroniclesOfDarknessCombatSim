[package]
name = "cod_sim"
version = "0.1.0"
edition = "2021"

[lib]
name = "cod_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rand = "0.8"
rand_xoshiro = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[dev-dependencies]
approx = "0.5"
